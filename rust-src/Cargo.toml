[package]
name = "unegg"
version = "0.5.0"
edition = "2021"
description = "EGG/ALZ archive decompressor - Rust implementation"
license = "MIT"

[dependencies]
flate2 = "1"
bzip2 = "0.5"
lzma-rs = "0.3"
aes = "0.8"
cbc = "0.1"
sha1 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
encoding_rs = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
